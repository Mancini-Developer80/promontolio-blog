services:
  db:
    image: postgres:16
    container_name: promontolio_db
    restart: always
    environment:
      # Docker cercherà queste variabili nel tuo file .env automaticamente
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
